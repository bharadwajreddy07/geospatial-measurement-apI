services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aereo
      POSTGRES_USER: aereo
      POSTGRES_PASSWORD: aereo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  api:
    build: .
    env_file: .env
    depends_on:
      - db
    ports:
      - "8000:8000"
volumes:
  postgres_data: